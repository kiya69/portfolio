---
layout: default
---

<div class="page-content">
  <h1>
    {{ page.title }}
  </h1>
  {% if page.image %}
    <div class="featured-image">
      <img src="{{ site.github.url }}{{ site.baseurl }}/assets/img/{{ page.image }}">
    </div>
  {% endif %}
  <article>
    {{ content }}
  </article>
</div>
