---
layout: default
---

<div class="page-content">
  <h1>
    {{ page.title }}
  </h1>
  {% if page.image %}
    <div class="featured-image">
      {% assign site_url = site.url | default: site.github.url %}
      <img src="{{ site_url }}{{ site.baseurl }}/assets/img/{{ page.image }}">
    </div>
  {% endif %}
  <article>
    {{ content }}
  </article>
</div>
